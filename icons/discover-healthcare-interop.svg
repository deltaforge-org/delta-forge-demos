<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="dhi" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Medical cross (healthcare) -->
  <rect x="16" y="14" width="28" height="28" rx="5" fill="url(#dhi)" opacity=".18" stroke="url(#dhi)" stroke-width="1.5"/>
  <rect x="26" y="20" width="8" height="16" rx="1.5" fill="url(#dhi)" opacity=".7"/>
  <rect x="22" y="24" width="16" height="8" rx="1.5" fill="url(#dhi)" opacity=".7"/>
  <!-- Three format streams converging (HL7 / FHIR / EDI) -->
  <path d="M50 20h14" stroke="url(#dhi)" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  <path d="M50 28h14" stroke="url(#dhi)" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  <path d="M50 36h14" stroke="url(#dhi)" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  <!-- Magnifying glass: DISCOVER reads the bytes -->
  <circle cx="44" cy="54" r="13" fill="url(#dhi)" opacity=".12" stroke="url(#dhi)" stroke-width="2.5"/>
  <line x1="54" y1="64" x2="66" y2="72" stroke="url(#dhi)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Delta triangle inside the lens: converted to Delta -->
  <path d="M44 47l7 13H37z" fill="url(#dhi)" opacity=".55"/>
</svg>
