<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="cci" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- Tower body -->
  <path d="M32 64 L40 28 L48 64" stroke="url(#cci)" stroke-width="2" stroke-linejoin="round" fill="url(#cci)" fill-opacity=".15"/>
  <!-- Cross braces -->
  <path d="M35 48 L45 48 M34 56 L46 56" stroke="url(#cci)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Antenna tip -->
  <circle cx="40" cy="25" r="2.5" fill="url(#cci)"/>
  <!-- Signal arcs (left) -->
  <path d="M31 17 A14 14 0 0 0 31 33" stroke="url(#cci)" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
  <path d="M25 12 A21 21 0 0 0 25 38" stroke="url(#cci)" stroke-width="1.8" stroke-linecap="round" opacity=".5"/>
  <!-- Signal arcs (right) -->
  <path d="M49 17 A14 14 0 0 1 49 33" stroke="url(#cci)" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
  <path d="M55 12 A21 21 0 0 1 55 38" stroke="url(#cci)" stroke-width="1.8" stroke-linecap="round" opacity=".5"/>
  <!-- Base line -->
  <path d="M20 67 L60 67" stroke="url(#cci)" stroke-width="2" stroke-linecap="round" opacity=".4"/>
  <!-- Concurrent regional feeds converging into the base -->
  <circle cx="13" cy="64" r="2.2" fill="url(#cci)" opacity=".6"/>
  <circle cx="23" cy="70" r="2.2" fill="url(#cci)" opacity=".6"/>
  <circle cx="57" cy="70" r="2.2" fill="url(#cci)" opacity=".6"/>
  <circle cx="67" cy="64" r="2.2" fill="url(#cci)" opacity=".6"/>
</svg>
