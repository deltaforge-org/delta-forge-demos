<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="ppa" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>
  <!-- Pump jack base -->
  <path d="M22 68l8-22h6l8 22z" fill="url(#ppa)" opacity=".22" stroke="url(#ppa)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Walking beam -->
  <path d="M14 34l38-8" stroke="url(#ppa)" stroke-width="3" opacity=".7" stroke-linecap="round"/>
  <!-- Horse head and counterweight -->
  <path d="M14 34q-5 3-4 9" stroke="url(#ppa)" stroke-width="2" fill="none" opacity=".6" stroke-linecap="round"/>
  <circle cx="54" cy="26" r="5" fill="url(#ppa)" opacity=".45"/>
  <!-- Pivot -->
  <circle cx="33" cy="30" r="3" fill="url(#ppa)" opacity=".8"/>
  <!-- Polished rod into the well -->
  <path d="M10 43v25" stroke="url(#ppa)" stroke-width="2" opacity=".55" stroke-linecap="round"/>
  <!-- Monthly volumes, declining -->
  <rect x="56" y="50" width="5" height="18" rx="1" fill="url(#ppa)" opacity=".6"/>
  <rect x="64" y="56" width="5" height="12" rx="1" fill="url(#ppa)" opacity=".45"/>
  <rect x="72" y="61" width="5" height="7" rx="1" fill="url(#ppa)" opacity=".3"/>
</svg>
