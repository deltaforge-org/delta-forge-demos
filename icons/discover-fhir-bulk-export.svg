<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="dfb" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Medical record sheet -->
  <rect x="18" y="14" width="34" height="44" rx="3" fill="url(#dfb)" opacity=".12" stroke="url(#dfb)" stroke-width="2.5"/>
  <!-- Record header line -->
  <line x1="24" y1="22" x2="46" y2="22" stroke="url(#dfb)" stroke-width="2" stroke-linecap="round" opacity=".5"/>
  <!-- Pulse / ECG trace across the record -->
  <path d="M23 38h6l3-8 4 16 3-8h7" stroke="url(#dfb)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Medical cross -->
  <path d="M35 47h3v3h3v3h-3v3h-3v-3h-3v-3h3z" fill="url(#dfb)" opacity=".55"/>
