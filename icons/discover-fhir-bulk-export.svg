  <circle cx="55" cy="55" r="11" fill="url(#dfb)" opacity=".12" stroke="url(#dfb)" stroke-width="2.5"/>
  <line x1="63" y1="63" x2="72" y2="72" stroke="url(#dfb)" stroke-width="3" stroke-linecap="round"/>
</svg>
