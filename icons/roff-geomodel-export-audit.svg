<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="gea" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <!-- The audit itself, over the pair of models -->
  <circle cx="40" cy="18" r="9" fill="url(#gea)" opacity=".2" stroke="url(#gea)" stroke-width="1.6"/>
  <path d="M46.4 24.4L52 30" stroke="url(#gea)" stroke-width="2" stroke-linecap="round"/>
