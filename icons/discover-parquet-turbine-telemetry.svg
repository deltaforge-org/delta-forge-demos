<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="dpt" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- Wind turbine tower -->
  <line x1="32" y1="34" x2="32" y2="64" stroke="url(#dpt)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Turbine hub -->
  <circle cx="32" cy="30" r="3" fill="url(#dpt)"/>
  <!-- Three rotor blades -->
  <path d="M32 30 L32 14" stroke="url(#dpt)" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <path d="M32 30 L46 38" stroke="url(#dpt)" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
  <path d="M32 30 L18 38" stroke="url(#dpt)" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <!-- Wind gusts -->
  <path d="M12 24c4 0 6-2 6-4" stroke="url(#dpt)" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  <path d="M10 32c5 0 8-2 8-5" stroke="url(#dpt)" stroke-width="2" stroke-linecap="round" opacity=".25"/>
  <!-- Magnifying glass: DISCOVER reads the bytes -->
  <circle cx="55" cy="55" r="11" fill="url(#dpt)" opacity=".12" stroke="url(#dpt)" stroke-width="2.5"/>
  <line x1="63" y1="63" x2="72" y2="72" stroke="url(#dpt)" stroke-width="3" stroke-linecap="round"/>
</svg>
