<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="gsm" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8b4fe"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <!-- A layer-cake corner point grid, each layer a different property value -->
  <path d="M10 26l30-14 30 14-30 14z" fill="url(#gsm)" opacity=".45" stroke="url(#gsm)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M10 26v8l30 14 30-14v-8l-30 14z" fill="url(#gsm)" opacity=".34" stroke="url(#gsm)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M10 40v8l30 14 30-14v-8l-30 14z" fill="url(#gsm)" opacity=".24" stroke="url(#gsm)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M10 54v8l30 14 30-14v-8l-30 14z" fill="url(#gsm)" opacity=".14" stroke="url(#gsm)" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Cell divisions on the top face -->
  <path d="M25 19l30 14M55 19L25 33" stroke="url(#gsm)" stroke-width="1" opacity=".4"/>
  <!-- The inactive wedge, cut out of the crest -->
  <path d="M55 19l15 7-15 7-15-7z" fill="none" stroke="url(#gsm)" stroke-width="1.4" opacity=".85" stroke-dasharray="3 2"/>
</svg>
