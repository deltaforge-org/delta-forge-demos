<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="rpl" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <!-- payment card -->
  <rect x="8" y="20" width="50" height="32" rx="4" fill="url(#rpl)" opacity=".2" stroke="url(#rpl)" stroke-width="1.5"/>
  <!-- magnetic stripe -->
  <rect x="8" y="26" width="50" height="6" fill="url(#rpl)" opacity=".45"/>
  <!-- chip -->
  <rect x="14" y="38" width="9" height="7" rx="1" fill="url(#rpl)" opacity=".6"/>
  <!-- card number band -->
  <rect x="27" y="40" width="14" height="3" rx="1" fill="url(#rpl)" opacity=".4"/>
  <rect x="27" y="46" width="20" height="2" rx="1" fill="url(#rpl)" opacity=".3"/>
  <!-- magnifier lens (the keyed lookup) -->
  <circle cx="54" cy="54" r="13" fill="url(#rpl)" opacity=".15"/>
  <circle cx="54" cy="54" r="13" fill="none" stroke="url(#rpl)" stroke-width="2.5"/>
  <!-- index tick inside the lens -->
  <line x1="49" y1="51" x2="59" y2="51" stroke="url(#rpl)" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <line x1="49" y1="55" x2="59" y2="55" stroke="url(#rpl)" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  <line x1="49" y1="59" x2="55" y2="59" stroke="url(#rpl)" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- magnifier handle -->
  <line x1="63" y1="63" x2="71" y2="71" stroke="url(#rpl)" stroke-width="3" stroke-linecap="round"/>
</svg>
