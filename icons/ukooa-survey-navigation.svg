  <circle cx="10" cy="55" r="2.5" fill="url(#usn)" opacity=".85"/>
  <circle cx="24" cy="51" r="2.5" fill="url(#usn)" opacity=".85"/>
  <circle cx="40" cy="53" r="2.5" fill="url(#usn)" opacity=".85"/>
  <circle cx="55" cy="55" r="2.5" fill="url(#usn)" opacity=".85"/>
  <circle cx="70" cy="51" r="2.5" fill="url(#usn)" opacity=".85"/>
  <!-- Grid reference beneath -->
  <path d="M8 66h64M20 62v8M44 62v8M64 62v8" stroke="url(#usn)" stroke-width="1" opacity=".35"/>
</svg>
