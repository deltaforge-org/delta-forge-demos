  <path d="M52 30l4-8h10l4 8z" fill="url(#usn)" opacity=".6" stroke="url(#usn)" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M61 22v-8" stroke="url(#usn)" stroke-width="1.5" opacity=".6" stroke-linecap="round"/>
