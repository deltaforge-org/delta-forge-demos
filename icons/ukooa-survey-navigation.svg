<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="usn" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <!-- Sea surface -->
  <path d="M4 30h72" stroke="url(#usn)" stroke-width="1.5" opacity=".45" stroke-linecap="round"/>
