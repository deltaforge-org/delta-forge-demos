<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="glb" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <!-- Graticule -->
  <rect x="10" y="12" width="60" height="56" rx="2" fill="url(#glb)" opacity=".08" stroke="url(#glb)" stroke-width="1.5"/>
  <path d="M30 12v56M50 12v56M10 30h60M10 50h60" stroke="url(#glb)" stroke-width="1" opacity=".35"/>
  <!-- Awarded blocks -->
  <rect x="30" y="30" width="20" height="20" fill="url(#glb)" opacity=".5"/>
  <rect x="50" y="12" width="20" height="18" fill="url(#glb)" opacity=".33"/>
  <rect x="10" y="50" width="20" height="18" fill="url(#glb)" opacity=".22"/>
  <!-- A relinquished block, outlined only -->
  <rect x="50" y="50" width="20" height="18" fill="none" stroke="url(#glb)" stroke-width="1.5" opacity=".7" stroke-dasharray="4 3"/>
  <!-- Block corner vertices -->
  <circle cx="30" cy="30" r="2.5" fill="url(#glb)" opacity=".9"/>
  <circle cx="50" cy="50" r="2.5" fill="url(#glb)" opacity=".9"/>
</svg>
