<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="lvdr" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fecdd3"/>
      <stop offset="1" stop-color="#881337"/>
    </linearGradient>
  </defs>
  <!-- The data room: a filing cabinet holding the whole log package -->
  <rect x="12" y="9" width="56" height="62" rx="4" fill="url(#lvdr)" opacity=".12" stroke="url(#lvdr)" stroke-width="1.5"/>
  <!-- Three drawers, one per LAS version in the package -->
  <rect x="18" y="15" width="44" height="16" rx="2" fill="url(#lvdr)" opacity=".3" stroke="url(#lvdr)" stroke-width="1.3"/>
  <rect x="18" y="34" width="44" height="16" rx="2" fill="url(#lvdr)" opacity=".22" stroke="url(#lvdr)" stroke-width="1.3"/>
  <rect x="18" y="53" width="44" height="16" rx="2" fill="url(#lvdr)" opacity=".14" stroke="url(#lvdr)" stroke-width="1.3"/>
  <!-- Drawer pulls -->
  <path d="M35 23h10M35 42h10M35 61h10" stroke="url(#lvdr)" stroke-width="2" opacity=".7" stroke-linecap="round"/>
  <!-- A log trace running the height of the cabinet: one table across all three -->
  <path d="M26 13c4 6-4 9 0 15s-4 9 0 15 4 9 0 15 3 7 1 11" stroke="url(#lvdr)" stroke-width="1.6" fill="none" opacity=".8" stroke-linecap="round"/>
  <!-- The 1.2 drawer is the oldest and the one that reads wrong: marked -->
  <circle cx="57" cy="61" r="3" fill="url(#lvdr)" opacity=".85"/>
</svg>
