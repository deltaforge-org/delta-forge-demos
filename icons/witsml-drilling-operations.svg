<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="wdo" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Derrick legs -->
  <path d="M20 66L38 12h4l18 54z" fill="url(#wdo)" opacity=".16" stroke="url(#wdo)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Cross bracing -->
  <path d="M27 46h26M30 34h20M33 23h14" stroke="url(#wdo)" stroke-width="1.4" opacity=".5" stroke-linecap="round"/>
  <!-- Crown block -->
  <rect x="35" y="8" width="10" height="5" rx="1.5" fill="url(#wdo)" opacity=".7"/>
  <!-- Drill string running to bottom hole -->
  <path d="M40 13v53" stroke="url(#wdo)" stroke-width="2" opacity=".75" stroke-linecap="round"/>
  <!-- Rig floor -->
  <rect x="14" y="66" width="52" height="5" rx="1.5" fill="url(#wdo)" opacity=".45"/>
  <!-- The hole, deviating: what the survey stations describe -->
  <path d="M40 71q1 6 9 9" stroke="url(#wdo)" stroke-width="2" fill="none" opacity=".6" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>
