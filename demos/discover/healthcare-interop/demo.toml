[demo]
id = "discover-healthcare-interop"
name = "Healthcare Interoperability Onboarding: DISCOVER across HL7, FHIR, EDI"
version = "1.0.0"
description = """
A hospital integration team receives clinical and billing data in three
different healthcare standards, all landing in one bronze zone: HL7 v2 ADT
messages, FHIR Patient resources (NDJSON bulk export), and X12 EDI claims
(837 professional/dental/institutional plus an 835 remittance).

This is the healthcare showcase for the DISCOVER command. Instead of
hand-writing a CREATE EXTERNAL TABLE with the right connector and OPTIONS for
each standard, the team points DISCOVER at each landing folder. DISCOVER reads
the actual bytes and recognises HL7 (the MSH segment), FHIR (the resource
shape), and X12 EDI (the ISA envelope), registering the matching external
table on its own. The queries then read each bronze feed on the fly and
convert it into a typed, governed silver Delta table: 6 HL7 admissions, 20
FHIR patients, and 4 EDI transactions. Both DISCOVER modes are shown (PRINT
to review the generated DDL, EXECUTE to register), and the bronze-to-silver
promotion uses CREATE DELTA TABLE plus INSERT ... SELECT.
"""
categories = ["discover", "healthcare", "hl7", "fhir", "edi"]
tags = ["discover", "format-detection", "auto-registration", "print-mode", "hl7", "fhir", "edi", "x12", "ndjson", "delta", "bronze-silver", "interoperability", "advanced"]
difficulty = "advanced"
estimated_time_minutes = 6

[demo.variables]
data_path = { description = "Path to the demo data directory (provisioned under the zone root).", required = false }
zone_name = { description = "Target zone for the landing folders. Defaults to `external`.", required = false }

