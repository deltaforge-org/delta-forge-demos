[demo]
id = "delta-row-index-payment-ledger"
name = "Card Payment Ledger - Row-Index Cost / Benefit"
version = "2.0.0"
author = "DeltaForge Team"
description = """
When does a row-level B+ tree index on a Delta table earn its keep, and when \
does it have no benefit at all? This demo answers it at scale and MEASURES \
every claim with SHOW STATS, on a 20,000,000-row card-payment ledger across \
~144 files. The lookup key (txn_id) is a scattered reference, so Delta's per-file \
min/max stats cannot prune it. The honest signal is rows_consumed: it is NULL \
only when the index served the row with no scan. The index HELPS exactly two \
things, an equality point lookup and a keyed point UPDATE, by reading or \
locating one row instead of decoding the whole ~130k-row group min/max already \
narrowed to. It has NO benefit for range scans, lookups on a non-indexed column, \
broad scans, or COUNT. The cost: one sorted leaf per row (20,000,000), built \
once and maintained on every write. All data generated inline with generate_series.
"""
categories = ["index"]
tags = ["delta-table", "advanced", "row-level-index", "index", "btree", "show-stats", "point-lookup", "20-million-rows", "update", "data-skipping"]
difficulty = "advanced"
estimated_time_minutes = 8

[demo.variables]
data_path = { description = "Root path where Delta table data is stored", required = true }
zone_name = { description = "Target zone name for tables (defaults to 'external')", required = false }

[[demo.target_objects]]
type = "delta_table"
name = "{{zone_name}}.delta_demos.payments"
