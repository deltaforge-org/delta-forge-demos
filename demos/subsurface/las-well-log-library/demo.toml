[demo]
id = "las-well-log-library"
name = "Well Log Library Consolidation"
version = "1.0.0"
author = "DeltaForge Team"
description = """\
An operator takes a position in Dutch acreage and receives the regulator's \
public log package with it: seven wells logged between 1958 and 1990, in \
LAS 2.0, arriving in two tranches. The logs are real NLOG composite logs \
as the OSDU Forum redistributes them. One external table spans the whole \
library even though the curve sets differ by thirty years of tool \
development, because the reader merges the per-file schemas into a union: \
gamma ray on all seven wells, sonic and density on three, and one 1990 \
well carrying nothing but a gamma ray. A well whose tool never recorded a \
sonic gets NULL for it, which is the truthful answer and not a zero. What \
this demo shows that the DLIS and LIS ones cannot is that the LAS \
well-information section rides on every row: the library is queryable by \
well, field and vintage with no join to a header table anywhere, and the \
well name comes out of the file's own header rather than its name. The \
load also turns the literal string UNKNOWN, which NLOG writes for an \
unattributed field, into a real NULL so it stops grouping as though it \
were a field. The loader keys on the source file, so the demo runs one \
tranche twice and asserts the count did not move. See ATTRIBUTION.md.
"""
categories = ["subsurface", "energy", "incremental-load"]
tags = [
    "subsurface",
    "las",
    "well-logs",
    "log-library",
    "schema-union",
    "nlog",
    "osdu",
    "real-data",
    "discover",
    "incremental",
    "idempotent",
    "null-handling",
    "delta",
    "time-travel",
    "beginner",
]
difficulty = "beginner"
estimated_time_minutes = 5

[demo.variables]
data_subdir = { description = "Zone-relative path to the staged demo data. DISCOVER's PATH and every LOCATION clause use this rather than the absolute data_path, because DISCOVER rejects an absolute path outright and a zone-relative one resolves under the zone's storage root wherever that is.", required = true }
zone_name = { description = "Target zone name (defaults to 'external')", required = false }

[[demo.data_files]]
path = "data/landing/2026-03-11_1958_MED-01.las"
format = "las"
description = "NLOG MED-01, Wassenaar, logged 1958, gamma and neutron only, 620 depth steps"
size_bytes = 28922

[[demo.data_files]]
path = "data/landing/2026-03-11_1961_WAS-25.las"
format = "las"
description = "NLOG WAS-25, Wassenaar, logged 1961, gamma and neutron, 407 depth steps"
size_bytes = 19762

[[demo.data_files]]
