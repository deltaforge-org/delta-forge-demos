[demo]
id = "shapefile-surface-footprint"
name = "Well Pad Lease Compliance"
version = "1.0.0"
author = "DeltaForge Team"
description = """An onshore operator has to prove that every well pad it has built sits inside a tract it actually leases. The land department holds the lease tracts as polygons and the drilling department holds the pads as points, and until both are in the same place nobody can answer the question. Two shapefile deliveries: 8 pads on one day, 4 tracts covering 6326 acres the next. A shapefile is three files that travel together, and the demo needs all three: the .shp holds geometry as big-endian record headers wrapped around little-endian coordinates, which is the format's own inconsistency and the detail that catches naive readers; the .dbf is a dBase III table with one attribute row per shape, in file order, with no key joining them; the .prj states the coordinate system. That missing key is asserted directly, because if geometry and attributes ever went out of step the table would still read and every pad would carry somebody else's identifier. The register is built with a LEFT join on purpose: an inner join would list the pads that ARE compliant and say nothing about the two that are not, which is the half of the answer that matters. PAD-06 was permitted north-east of the acreage and PAD-07 was drilled south-west of it in 2022 and has since been plugged.
"""
categories = ["subsurface", "energy", "incremental-load"]
tags = [
    "subsurface",
    "shapefile",
    "geospatial",
    "esri",
    "dbf",
    "land-management",
    "compliance",
    "left-join",
    "discover",
    "incremental",
    "idempotent",
    "delta",
    "time-travel",
    "intermediate",
]
difficulty = "intermediate"
estimated_time_minutes = 5

[demo.variables]
data_subdir = { description = "Zone-relative path to the staged demo data. DISCOVER's PATH and every LOCATION clause use this rather than the absolute data_path, because DISCOVER rejects an absolute path outright and a zone-relative one resolves under the zone's storage root wherever that is.", required = true }
zone_name = { description = "Target zone name (defaults to 'external')", required = false }

[[demo.data_files]]
path = "data/landing/2026-03-11_well_pads.dbf"
format = "shapefile"
description = "Well pad attributes: identifier, operator, spud year, status and surface coordinates"
size_bytes = 794

[[demo.data_files]]
path = "data/landing/2026-03-11_well_pads.prj"
format = "shapefile"
description = "Coordinate system for the pad layer, as well-known text"
size_bytes = 393

[[demo.data_files]]
path = "data/landing/2026-03-11_well_pads.shp"
format = "shapefile"
description = "Well pad point geometry, 8 shapes, NAD83 UTM zone 13N"
size_bytes = 324

[[demo.data_files]]
path = "data/landing/2026-03-12_lease_tracts.dbf"
format = "shapefile"
description = "Lease tract attributes: identifier, lessor, expiry, bounding box and acres"
size_bytes = 678

[[demo.data_files]]
path = "data/landing/2026-03-12_lease_tracts.prj"
format = "shapefile"
description = "Coordinate system for the tract layer, as well-known text"
size_bytes = 393

[[demo.data_files]]
path = "data/landing/2026-03-12_lease_tracts.shp"
format = "shapefile"
description = "Lease tract polygon geometry, 4 closed rings"
size_bytes = 644

[[demo.target_objects]]
type = "external_table"
name = "{{zone_name}}.surface_land.well_pads"

[[demo.target_objects]]
type = "external_table"
name = "{{zone_name}}.surface_land.lease_tracts"

[[demo.target_objects]]
type = "delta_table"
name = "{{zone_name}}.surface_land.pad_compliance"
