[demo]
id = "shapefile-surface-footprint"
name = "Offshore Lease Footprint"
version = "2.0.0"
author = "DeltaForge Team"
description = """Every active oil and gas lease on the United States Outer Continental Shelf, as the Bureau of Ocean Energy Management publishes it, loaded against the official block grid it is measured on. The data is real and in the public domain: 1870 lease polygons carrying lease number, mineral type, royalty rate, effective date, status and current area, and 29,186 block polygons across the three Gulf of Mexico planning areas. A shapefile is not one file but a set, and the demo reads the .shp for geometry, the .dbf for attributes and the .prj for the coordinate system as one table. Real data brings constraints a written fixture never would. The DBF format truncates every field name to ten characters, so LEASE_NUMBER arrives as lease_numb and SALE_NUMBER as sale_numbe, and some names end in a bare underscore where the truncation landed on one; the demo asserts these names rather than pretending they are tidy. The coordinate system is NAD27 rather than the WGS84 most tools assume, which is a real datum mismatch worth seeing. And the register spans ninety years: 138 leases still active today took effect before 1970, the oldest in February 1936, which is the kind of range that breaks a date parser written against a decade of synthetic dates.
"""
categories = ["subsurface", "energy", "incremental-load"]
tags = [
    "subsurface",
    "shapefile",
    "geospatial",
    "boem",
    "leases",
    "open-data",
    "real-data",
    "dbf",
    "well-known-binary",
    "discover",
    "incremental",
    "idempotent",
    "delta",
    "time-travel",
    "intermediate",
]
difficulty = "intermediate"
estimated_time_minutes = 6

[demo.variables]
data_subdir = { description = "Zone-relative path to the staged demo data. DISCOVER's PATH and every LOCATION clause use this rather than the absolute data_path, because DISCOVER rejects an absolute path outright and a zone-relative one resolves under the zone's storage root wherever that is.", required = true }
zone_name = { description = "Target zone name (defaults to 'external')", required = false }

[[demo.data_files]]
path = "data/landing/leases.shp"
format = "shapefile"
description = "BOEM active oil and gas leases, 1870 polygons (SHP component). Public domain, a work of the United States government."
size_bytes = 383128

[[demo.data_files]]
path = "data/landing/leases.shx"
format = "shapefile"
description = "BOEM active oil and gas leases, 1870 polygons (SHX component). Public domain, a work of the United States government."
size_bytes = 15060

[[demo.data_files]]
path = "data/landing/leases.dbf"
format = "shapefile"
description = "BOEM active oil and gas leases, 1870 polygons (DBF component). Public domain, a work of the United States government."
size_bytes = 990256

[[demo.data_files]]
path = "data/landing/leases.prj"
format = "shapefile"
description = "BOEM active oil and gas leases, 1870 polygons (PRJ component). Public domain, a work of the United States government."
size_bytes = 168

[[demo.data_files]]
path = "data/landing/leases.cpg"
format = "shapefile"
description = "BOEM active oil and gas leases, 1870 polygons (CPG component). Public domain, a work of the United States government."
size_bytes = 5

[[demo.data_files]]
path = "data/landing/blocks.shp"
format = "shapefile"
description = "BOEM Outer Continental Shelf lease blocks, 29,186 polygons (SHP component). Public domain, a work of the United States government."
size_bytes = 5947096

[[demo.data_files]]
path = "data/landing/blocks.shx"
format = "shapefile"
description = "BOEM Outer Continental Shelf lease blocks, 29,186 polygons (SHX component). Public domain, a work of the United States government."
size_bytes = 233588

[[demo.data_files]]
path = "data/landing/blocks.dbf"
format = "shapefile"
