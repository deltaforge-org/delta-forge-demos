[demo]
id = "resqml-model-handover"
name = "Reservoir Model Handover Audit"
version = "1.1.0"
author = "DeltaForge Team"
description = """A partner delivers reservoir models as RESQML packages, and before the asset team loads them into the modelling software somebody has to audit what arrived: what objects, how they reference each other, and which of them point at bulk arrays living in a companion HDF5 file. Three REAL packages over two days, 56 objects across 16 types, naming 90 HDF5 datasets between them. They are the resqpy project's own example models with their .h5 companions delivered alongside, so the dependency list the audit produces names datasets that really exist in files that really came with the packages. An .epc is an Open Packaging Conventions ZIP and DeltaForge opens the archive itself rather than handing it to the XML engine, which matters because a ZIP holding XML parts is also what an .xlsx is. Reading real packages found two reader defects, both fixed and both asserted here: docProps/core.xml is package metadata rather than a RESQML object and was being emitted as one, and a DataObjectReference names its target in a UUID child element rather than a uuid attribute, so the reference graph read as empty across all 56 objects while every other column was right. See ATTRIBUTION.md.
"""
categories = ["subsurface", "energy", "incremental-load"]
tags = [
    "subsurface",
    "resqml",
    "epc",
    "energistics",
    "reservoir-model",
    "handover",
    "audit",
    "hdf5",
    "opc-package",
    "resqpy",
    "real-data",
    "discover",
    "incremental",
    "idempotent",
    "delta",
    "time-travel",
    "intermediate",
]
difficulty = "intermediate"
estimated_time_minutes = 6

[demo.variables]
data_subdir = { description = "Zone-relative path to the staged demo data. DISCOVER's PATH and every LOCATION clause use this rather than the absolute data_path, because DISCOVER rejects an absolute path outright and a zone-relative one resolves under the zone's storage root wherever that is.", required = true }
zone_name = { description = "Target zone name (defaults to 'external')", required = false }

[[demo.data_files]]
path = "data/landing/arrays/2026-03-11_block.h5"
format = "hdf5"
description = "The HDF5 companion holding block.epc bulk arrays, delivered with it"
size_bytes = 271140

[[demo.data_files]]
path = "data/landing/arrays/2026-03-12_s_bend.h5"
format = "hdf5"
description = "The HDF5 companion holding s_bend.epc bulk arrays"
size_bytes = 460195

[[demo.data_files]]
path = "data/landing/arrays/2026-03-12_tic_tac_toe.h5"
format = "hdf5"
description = "The HDF5 companion holding tic_tac_toe.epc bulk arrays"
size_bytes = 5552

[[demo.data_files]]
path = "data/landing/packages/2026-03-11_block.epc"
format = "resqml"
description = "resqpy example model block.epc, 26 RESQML objects across 16 types, naming 22 HDF5 datasets"
size_bytes = 115027

[[demo.data_files]]
path = "data/landing/packages/2026-03-12_s_bend.epc"
format = "resqml"
description = "resqpy example model s_bend.epc, 24 objects including twelve blocked wellbores, naming 67 HDF5 datasets"
size_bytes = 161618

[[demo.data_files]]
path = "data/landing/packages/2026-03-12_tic_tac_toe.epc"
format = "resqml"
description = "resqpy example model tic_tac_toe.epc, 6 objects, the smallest complete package"
size_bytes = 24446

[[demo.target_objects]]
type = "external_table"
name = "{{zone_name}}.model_handover.model_packages"

[[demo.target_objects]]
type = "delta_table"
name = "{{zone_name}}.model_handover.model_inventory"
