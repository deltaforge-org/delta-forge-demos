[demo]
id = "concurrent-cdr-ingestion"
name = "Concurrent CDR Ingestion"
version = "1.0.0"
author = "DeltaForge Team"
description = """
A mobile carrier's ten regional Mobile Switching Centers each export a daily \
Call Detail Record file with an identical schema (20,350 rows across ten CSVs). \
The nightly mediation job loads all ten feeds concurrently into one central \
Delta table using CONCURRENT BEGIN...END, then repeats the load with a \
range-split PARALLEL INSERT into a second table. The demo proves optimistic \
concurrency control lands every record exactly once: no lost writes, no \
duplicates, one commit per writer, and identical results from both methods.
"""
categories = ["csv", "concurrency"]
tags = ["csv", "advanced", "concurrency", "concurrent-insert", "parallel-insert", "delta-table", "optimistic-concurrency", "telecom", "cdr", "multi-file"]
difficulty = "advanced"
estimated_time_minutes = 6

[demo.variables]
data_path = { description = "Root path where demo data files are stored", required = true }
zone_name = { description = "Target zone name for tables (defaults to 'external')", required = false }

